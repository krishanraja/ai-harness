# Until 2026-09-09 the Codex and Cursor adapters told agents that the canonical
# skills were exposed there. They were not, and have never been. That claim was
# inherited from the pre-rendered adapters and carried into the first version of
# this file without being checked against a machine.
#
# It is NOT deleted here. Deletion is an irreversible external mutation and
# needs Krish's explicit approval for that named target, and some of those 61
# may be deliberate. It is recorded so the audit can name it.
unmanaged_directories:
  - id: agents-skills-inert-20260908
    path: C:\Users\krish\.agents\skills
    surface: windows-primary
    observed: 2026-09-08
    entries: 63
    detail: 62 directories plus a loose ml-engineer.md. Recorded as 61 until the machine counted it.
    canonical: 0
    forbidden_present: [strategy, ux, ux-concepts, ux-principles, design, uiux-toolkit, design-system-starter, N8N, fleet-ops]
    # Ruled 2026-09-08, after LORIMER checked what actually reads it. Nothing does.
    # No skills path points here in .claude/settings.json, .claude/settings.local.json,
    # .claude.json, .codex/config.toml or .cursor/mcp.json, and no installed instruction
    # file names it. A sweep of all three client trees hit only transcripts and caches.
    # The nine forbidden skills are inert, not a live routing risk. It stays a
    # third-party catalog. Nothing here is read from, installed to, or deleted.
    status: superseded
    ruled: 2026-09-08
    source: a27170f03ec683b8c3e4abef0adf6f6cba7e37e0
    valid_until: 2026-09-12
    superseded_by: agents-skills-empty-20260912

  - id: agents-skills-empty-20260912
    path: C:\Users\krish\.agents\skills
    surface: windows-primary
    observed: 2026-09-12
    entries: 0
    detail: Empty after the preserved catalogue and malformed quarantine copies were moved out of auto-discovery.
    canonical: 0
