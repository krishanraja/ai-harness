# Verbatim snapshots of the two documents the judge benches are built from.
#
# Neither lives in this repository. The technical source is in the mm-ctrl
# venture repo; the personal source is a Google Sheet. A bench pointed at a
# document it cannot version is a bench that silently changes underneath its own
# verdicts, so each is captured here with its hash and the date it was taken.
#
# These files are never edited. They are third-party captures, held verbatim so
# a criterion can quote them and a reader can check the quote. The em dash rule
# does not apply to them for the same reason it does not apply to a vendored
# tree: they are not ours to rewrite. They are stored as .txt so the validator
# does not treat them as canon prose.
#
# When the live document moves past its snapshot, the audit opens
# bench-source-stale and it stays open until a new snapshot lands here and the
# bench cites it. Refreshing a snapshot is a read a person or a Routine does;
# the Actions runner has no path to Drive and is not given one.

schema_version: 1

