# Every place a memory lives, and what is to become of it.
#
# The question this file answers is the one the audit could never answer: not
# "is the canon well formed" but "is this the only memory, and if not, what is
# in the others". Counted live on 2026-09-09 against the operating system's
# Supabase project and every checkout.
#
# disposition:
#   canon      this repository. The governed, versioned, released memory.
#   feed       an input the observer reads into state/observations/.
#   migrate    content that belongs in the brain and is not here yet.
#   retire     dead. Imported once as history, then marked, never dropped.
#   reference  legitimate operational state. The brain points at it by id and
#              never copies it, because copying it would create a second truth.
#
# Nothing here is deleted. Deletion is an irreversible external mutation and
# needs Krish's approval for that named target, which is the same rule that
# governs the unmanaged skills catalogue in contract/paths.yaml.

schema_version: 1
counted: 2026-09-09
project: gojpffsrxybbpbdzzrvs

stores:
  # ------------------------------------------------------------------ canon
  - id: harness-canon
    where: this repository
    disposition: canon
    holds: two contracts, 29 skills, 314 provenance entries, observations, proposals, canaries
    read_by: every client on every surface
    written_by: pull request only

  - id: citation-coverage-ledger
    where: brain/usage.jsonl
    disposition: canon
    holds: append-only citations of canon rules by independent judges and synthetic canaries
    first_write: 2026-09-12
    read_by: brain-usage.mjs and audit-harness.mjs
    written_by: pull request only
    candidate_producers: judge.mjs and canaries.mjs
    asker_source: approved_by in state/skill-registry.yaml, resolved automatically by Invoke-HarnessSync.ps1
    write_gate: >
      PR-enabled machine sync stages citation candidates on its named evidence
      branch with the canary and deployment records. Canary-only and no-PR runs
      route both reports and citation candidates to scratch. Only merge admits
      candidate rows into this canon-disposition store.
    validity: >
      Each event is historical evidence scoped to its immutable ref, not a claim
      about the current release and not proof of real-world use or efficacy.
      Canary rows carry evidence_class synthetic-evaluation and scope
      skill-retrieval-only. Rows admitted from v2026.09.12.4 onward name the
      asker who authorised the sweep; earlier rows are retained as legacy
      history and make no asker-provenance claim. A current-coverage claim must
      match the release being evaluated; older rows remain append-only history
      and are never overwritten.
    retirement: >
      Stop future writes through a reviewed proposal. Keep prior rows with their
      refs; event facts do not become false when a later selector or release changes.

  # --------------------------------------------------------- the big finding
  #
  # This is the most important row in the file.
  #
  # standards_registry has the schema the brain was about to build from
  # scratch: rule_text, source, source_date, source_context, supersedes,
  # active, deprecated_at, deprecation_reason, hit_count, last_hit_at,
  # repeat_violations_30d, applied_at, last_efficacy_check. Provenance,
  # supersession and efficacy, all of it, designed in April.
  #
  # It was then abandoned. The numbers are the argument:
  #
  #   169 rows, 122 still marked active, 47 deprecated
  #   0 rows have ever used the supersedes column
  #   6 of 169 have ever been hit
  #   0 have ever had an efficacy check
  #   no new row since 2026-05-31, last touched 2026-08-06
  #
  # That is the memory doctrine's "dead zones, never retrieved" failure in the
  # flesh, in a store built to prevent exactly it. And 122 rules are nominally
  # LIVE, which means Krish has two live rule sets: 314 entries here and 122
  # there, with nothing reconciling them.
  #
  # They may not be junk. A sample of six active rows read on 2026-09-09
  # includes "Zero em dashes", which this repository enforces independently;
  # "No future tense promises"; "Confidence Tax", requiring every confidence
  # claim to cite evidence; and a ban on mocked execution in scripts. Three of
  # those have no equivalent in the canon.
  #
  # Whether they are worth adding is NOT asserted here. Nobody has touched
  # these rows since 31 May, none has ever had an efficacy check, and calling
  # them good on that basis would be reasoning confidently from unverified
  # material, which is the failure this whole layer exists to catch. The claim
  # is deferred to the triage below, which is where it can be checked.
  - id: standards_registry
    where: supabase
    disposition: migrate
    rows: 169
    active_rows: 122
    deprecated_rows: 47
    first_write: 2026-04-14
    last_new_row: 2026-05-31
    last_touched: 2026-08-06
    supersedes_used: 0
    ever_hit: 6
    efficacy_checks: 0
    read_by: nothing in this repository
    written_by: unknown, nothing since May
    action: >
      Triage the 122 active rows against the 314 entries in brain/rules.yaml.
      Each is one of three things: already said by the canon, worth adding to
      the canon, or genuinely dead. This is a reading job for Krish and it is
      the highest value item in this file, because until it is done two live
      rule sets contradict each other in silence. The em dash rule is a known
      twin of the canon's own and is the first one to resolve, in one direction
      or the other, rather than leaving it live on both sides.
    progress_2026_09_10: >
      The half of this row's diagnosis that was about THIS repository is now
      closed. brain/usage.jsonl records every citation of a canon rule by the
      judge or by a passing canary, and scripts/audit-harness.mjs opens a
      dead-zone finding for live rules nothing has ever cited, so the canon
      cannot quietly accumulate the condition this row describes. The honest
      first number is 0 of 314: the ledger begins empty and no producer has run
      against it yet. scripts/validate-surfaces.mjs also warns when a live rule
      in one contract restates a live rule in the other, which is the in-canon
      half of the same contradiction this row records across stores. Its first
      run found one pair, at 70 percent overlap:
      always-on-execution-chain.intent-briefing-when-triggered and
      global-chain.take-the-brief-runs.
    progress_2026_09_12: >
      The 2026-09-10 paragraph above remains verbatim historical text. Today the
      ledger has 86 rows against 317 live rules. Every current row came from a
      v2026.09.12.3 canary, is explicitly labelled synthetic-evaluation with
      scope skill-retrieval-only, and is valid only for its immutable report ref.
      This is retrieval coverage, not real-world use, efficacy, or current-release
      proof. The new citation-coverage-ledger row above records its lifecycle.
    why_still_migrate: >
      None of that triages the 122 rows. The instrument now exists; the reading
      job does not do itself.

