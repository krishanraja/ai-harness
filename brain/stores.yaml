    retirement_evidence: >
      Verified 2026-09-09 by grep across every md, mjs, yaml, yml and ps1 file in this repository: zero references. The single row is kept.
    action: See judge_verdicts. One run, then nothing.

  - id: memory
    where: supabase
    disposition: reference
    rows: 5
    last_write: 2026-04-15
    action: Five LinkedIn post hooks. Misnamed. Content state, not memory.

  # -------------------------------------------------------------- reference
  - id: agents.brief_content
    where: supabase
    disposition: reference
    rows: 14
    action: >
      The fourteen agent briefs, not rendered from the canon and carrying zero
      learned_plays. Owned by mindmake-os. The harness renders a canon block
      into that repository and its deploy path composes the briefs; the harness
      never writes this table.

  - id: operational-queues
    where: supabase
    disposition: reference
    covers: [decisions_waiting, content_decisions, content_slate_rulings, workflow_proposals, system_improvements, audit_log, silent_failures]
    action: >
      Legitimate operational state owned by the OS. The brain references by id
      and never copies. A decision here that should change the canon travels by
      the existing Ruling (Krish, DATE) path.

  - id: client-native-memory
    where: each machine
    disposition: reference
    action: >
      Claude Code auto-memory, Cursor rules and Codex notes. Zero mentions
      anywhere in the canon or the adapters, so it is ungoverned. The rule is
      that native memory is scratch and never authority, and anything durable
      found there is proposed to the brain.
