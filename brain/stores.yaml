  - id: decision-ledger-store
    where: >
      Nowhere authoritative yet. The decision-ledger skill names a Supabase
      decisions table that does not exist. brain/decisions.jsonl was created
      2026-09-09 and holds real content, but nothing routes the skill to it.
    disposition: migrate
    migration_state: destination-exists-skill-not-repointed
    action: >
      The decision-ledger skill names Supabase as its canonical store and there
      is no decisions table. The skill also says never to create an ad hoc
      permanent file, so repointing it is a skill rewrite through the proposal
      path, not a config change.
    progress_2026_09_09: >
      brain/decisions.jsonl now exists and holds fifteen entries: Krish's ten
      rulings on the agent rules that had been waiting unapproved in corrections
      since 2026-08-24, and five rulings on the operating system itself. Each row
      carries his wording verbatim in krish_wording, the amended rule text
      wherever he changed a proposal, the corrections row it answers, and the
      reason. Append only, latest row per id wins, the same shape as
      proposals.jsonl.
    why_still_migrate: >
      The judge panel caught this entry being flipped to canon in the same change
      that created the file, which would have been the config edit this row
      itself forbids, and would have declared a migration finished while the only
      consumer still points somewhere else. A destination holding content is not
      the same as a store being canonical. This stays migrate until the skill is
      repointed through a proposal, and that proposal is what closes it.
    superseded_wording: >
      Until 2026-09-09 this row read "where: nowhere" with no progress fields.
      That text is superseded by the two fields above, not deleted, because the
      file's own rule is that nothing here is dropped.

  - id: openclaw-vps-host-state
    where: the OpenClaw VPS, /root/.openclaw, 4.5 GB
    disposition: reference
    owner: mindmake-os
    holds: >
      Runtime state for a host that was assumed dormant and is not. 31 root cron
      entries, 33 gateway jobs on a scheduler the repository did not know
      existed, 196 days uptime, and the n8n execution governor that runs here
      rather than in n8n so it cannot be starved by the thing it measures.
    reads_from_brain: >
      agents.brief_content, pulled from Supabase every 15 minutes by
      render-identity.py. The only working brain-to-filesystem pump in the fleet.
    writes_to_brain: >
      system_health every 15 minutes, workflow_runs, and from 2026-09-09 an
      hourly heartbeat via scripts/vps-heartbeat.sh.
    action: >
      Reference, not migrate. The host is declared as a surface in
      state/fleet.yaml rather than retired, because a watchdog outside the
      systems it watches is a property the rest of the estate cannot give
      itself. What migrates is definitions, not state: the 33 gateway jobs and
      the agent runtime bindings, which exist in exactly one copy on one disk.
    excluded_by_ruling: >
      The four personal agents and their memory. Ruled 2026-09-09: leave them
      entirely alone. No backup, no migration, no cataloguing. The risk of disk
      loss is real and accepted, and recorded here so it is a decision rather
      than an oversight.
    unsettled: >
      main.sqlite, ops.sqlite and cleo.sqlite, 77 MB across the three business
      agents. Evidence points to session transcripts rather than curated memory,
      since the documented model puts durable memory in MEMORY.md and Postgres
      and no document mentions these files, but it is not proven. Reading the
      table names settles it.
    evidence: state/vps-liveness-audit-2026-09-09.md
    declared: 2026-09-09

