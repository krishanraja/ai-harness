  - id: judge_verdicts
    where: supabase
    disposition: retire
    rows: 2
    retired_at: 2026-09-09
    retirement_evidence: >
      Verified 2026-09-09 by grep across every md, mjs, yaml, yml and ps1 file in this repository: zero references. Retired as a store, not as evidence: the two rows are kept and are worth reading before the new panel is trusted.
    action: >
      A judge concept existed here before this one and ran twice. Read the two
