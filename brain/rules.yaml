# Provenance for every rule in the canon.
#
# Written by scripts/brain-rules.mjs, checked by scripts/validate-surfaces.mjs.
# One entry per top-level rule in the two contracts, and one per chapter of
# every skill. text_sha is the sha256 of the rule text (first 12 hex), so an
# edit without a new source is arithmetic to detect rather than a judgement.
#
# source.kind:
#   founding  the rule predates this ledger. We know when, not why.
#   ruling    a Ruling (Krish, DATE) line in the commit that introduced it.
#   proposal  a docs/proposals entry a human accepted.
#   import    carried in from a source outside this repository.
#
# Ids are slugs of the rule's own opening words, never ordinals: inserting a
# rule must not rename the ones below it, or provenance cannot survive the edit.

