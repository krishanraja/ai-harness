# The surface list.
#
# A surface is anywhere the canon has to arrive: a repository whose AGENTS.md
# carries the canon block, a client adapter rendered from the templates, or a
# machine that installs a release and reports back.
#
# The repos list is asserted against docs/steward/fleet.json (the docs
# steward's manifest, in this repository since 2026-10-15) by
# scripts/validate-surfaces.mjs, so the docs steward and the harness steward
# cannot drift apart without a failing check.

schema_version: 1
owner: krishanraja

repos:
  - name: ai-harness
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, contract/krish-operating-contract.md, contract/skill-routing-contract.md]
    note: The canon repository. It carries the block like everyone else so no surface is exempt.

  - name: control-center
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/MINDMAKE_OS_ARCHITECTURE.md]

  - name: mm-ctrl
    # Same GitHub repository, id 1090040458; the former name redirects here.
    aliases: [mindmake-ctrl]
    canon_target: AGENTS.md
    entry: CLAUDE.md
    rules_files: [CLAUDE.md, project-documentation/AGENT_BRIEFING.md]

  - name: mindmake
    canon_target: AGENTS.md
    entry: CLAUDE.md
    rules_files: [CLAUDE.md, project-documentation/06_CURRENT_STATE.md]
    who_krish: false
    canon_sync: false
    canon_sync_reason: >-
      Ruling (Krish, 2026-10-06): keep the mindmake repository out of the canon rollout;
      he closed its canon pull request and it must not be reopened nightly. The
      reconciler and the seeder skip it entirely, so no stamp-only pull request is
      opened when a release moves the stamp.
    note: >-
      Stays in this list for parity with the docs steward's fleet.json and so the
      observer still reads its rulings. who_krish false is kept so that, if the sync is
      ever turned back on, the who-Krish paragraph stays out. Ruling (Krish,
      2026-10-05): his ikigai, venture objectives, pricing and revenue are published in
      control-center and ai-harness, and the mindmake repository is excluded because it is
      one product focused on one thing.

  - name: fractionl-circle
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, AGENT_BRIEFING.md, docs/DELIVERY_STATE.md]

  - name: fractionl-pulse
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/AGENT_BRIEFING.md, docs/DOCUMENTATION_GOVERNANCE.md]

  - name: full-time
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/19-release-state.md]

  - name: content-engine
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, CLAUDE.md, docs/CAROUSEL-STANDARD.md]
    note: >-
      Current GitHub identity for the Mindmake Video Engine. Repository-scoped skills
      under .agents/skills are deliberate and not drift: the engine is client-neutral
      by design.

  - name: contentarchives
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, RESUME.md]

  - name: AEO-Engine
    checkout: aeo-engine
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/PACKET.md, docs/STATE.md]
    note: The docs steward fleet spells it AEO-Engine; the repository itself is aeo-engine. Parity is compared case-insensitively rather than one manifest quietly renaming the other.

  - name: makeyourmindup
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, project-documentation/02_REPO_BRIEF.md, engine/ENGINE_SPEC.md]
    note: The publication and strategy machine. Added when the docs steward admitted it to the fleet so the two control planes cannot silently disagree.

  - name: heartside
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, README.md, docs/SYNC.md]
    note: >-
      Ruling (Krish, 2026-10-22): a venture's own repository is the only reference for its
      status and next steps, kept current by the docs steward's NOW.md; nowhere else holds
      them. Admitted to the fleet so that guarantee covers Heartside.

  - name: legibility
    canon_target: AGENTS.md
