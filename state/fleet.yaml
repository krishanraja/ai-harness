# The surface list.
#
# A surface is anywhere the canon has to arrive: a repository whose AGENTS.md
# carries the canon block, a client adapter rendered from the templates, or a
# machine that installs a release and reports back.
#
# The repos list is asserted against krishanraja/control-center
# docs/steward/fleet.json by scripts/validate-surfaces.mjs, so the docs steward
# and the harness steward cannot drift apart without a failing check.

schema_version: 1
owner: krishanraja

repos:
  - name: ai-harness
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, contract/krish-operating-contract.md, contract/skill-routing-contract.md]
    note: The canon repository. It carries the block like everyone else so no surface is exempt.

  - name: control-center
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/steward/RUNBOOK.md, docs/MINDMAKE_OS_ARCHITECTURE.md]

  - name: mm-ctrl
    canon_target: AGENTS.md
    entry: CLAUDE.md
    rules_files: [CLAUDE.md, project-documentation/AGENT_BRIEFING.md]

  - name: mindmake
    canon_target: AGENTS.md
    entry: CLAUDE.md
    rules_files: [CLAUDE.md, project-documentation/06_CURRENT_STATE.md]

  - name: fractionl-circle
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, AGENT_BRIEFING.md, docs/DELIVERY_STATE.md]

  - name: fractionl-pulse
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/AGENT_BRIEFING.md, docs/DOCUMENTATION_GOVERNANCE.md]

  - name: full-time
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/19-release-state.md]

  - name: mindmake-video-studio
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, CLAUDE.md, docs/CAROUSEL_ENGINE_STATE.md]
    note: >-
      Two findings recorded rather than fixed here. GitHub renamed this repository to
      krishanraja/content-engine on an unknown date and redirects transparently, so both
      fleet manifests, the build-signal registry and this repo's own NOW.md still name
      mindmake-video-studio; renaming needs one deliberate coordinated change, not a side
      effect. Repository-scoped skills under .agents/skills are deliberate and not drift:
      the engine is client-neutral by design.

  - name: contentarchives
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, RESUME.md]

  - name: AEO-Engine
    checkout: aeo-engine
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/PACKET.md, docs/STATE.md]
    note: The docs steward fleet spells it AEO-Engine; the repository itself is aeo-engine. Parity is compared case-insensitively rather than one manifest quietly renaming the other.

adapters:
  - id: claude
    template: contract/templates/adapter-claude.md
    output: adapters/claude/CLAUDE.md
    surface: windows-primary
  - id: codex
    template: contract/templates/adapter-codex.md
    output: adapters/codex/AGENTS.md
    surface: windows-primary
  - id: cursor
    template: contract/templates/adapter-cursor.mdc
    output: adapters/cursor/krish-core.mdc
    surface: windows-primary

machines:
  - id: windows-primary
    clients: [claude-code-user, cursor-primary, claude-desktop]
    reports: pull-and-report
  - id: windows-codex
    clients: [codex-surface-07a67cda9f99]
    reports: pull-and-report
    note: Known gap. This surface installed v2026.08.29.1 while the fleet is on v2026.08.29.3.
  - id: cloud-linux
    clients: [github-actions, claude-code-web]
    reports: rendered-per-run
    note: Ephemeral. Renders from the commit it checks out, so it is never behind by construction.
  - id: openclaw-vps
    clients: [openclaw-gateway]
    reports: heartbeat-and-health
    note: >
      Declared 2026-09-09 after a read-only audit disproved the assumption that it
      was idle. 31 root cron entries, 33 gateway jobs, 196 days uptime. It already
      reads the brain and writes to it every 15 minutes and was in no manifest,
      which is why five render logs could die at the 2026-08-29 rebrand and go
      unnoticed for eleven days. Evidence: state/vps-liveness-audit-2026-09-09.md.

# What each surface takes from the brain, and what it gives back.
#
# The question was whether every place Krish works contributes to the central
# memory as well as reading from it. Listed honestly, most do not. A surface
# that only reads is a place where a ruling made in conversation is lost the
# moment the session ends, and audit-harness.mjs opens a standing
# surface-contract finding for every one of them until it has a write path.
surface_contracts:
  - id: claude-code-lorimer
    reads: canon block, rendered adapter, 29 installed skills
    writes: Ruling (Krish, DATE) lines in commit bodies, canary reports
    gap: Client-native auto-memory is ungoverned and nothing in the canon mentions it.

  - id: cursor-lorimer
    reads: krish-core.mdc, 29 installed skills
    writes: rulings in commit bodies
    gap: No canary path, because Cursor has no headless client that exposes skill invocation as observable output. Native rules are ungoverned.

  - id: codex-lorimer
    reads: AGENTS.md, 29 installed skills
    writes: rulings in commit bodies, canary reports

  - id: codex-surface
    reads: AGENTS.md, 29 installed skills
    writes: rulings in commit bodies, canary reports

  - id: claude-code-cloud
    reads: canon block
    writes: pull requests, rulings, observations, proposals

  - id: claude-ai-chat
    reads: cloud skill catalogue, two releases behind
    writes: nothing
    gap: >
      The biggest reader in the fleet and it has never written one thing back.
      Every ruling made in conversation there is lost. The import-memory skill
      already exists and is the cheapest write path available.

  - id: perplexity-computer
    reads: cloud skill catalogue, two releases behind
    writes: nothing
    gap: Same as claude.ai chat, with no import path of its own.

  - id: n8n-agents
    reads: agents.brief_content, which is not rendered from the canon
    writes: nothing
    gap: >
      Fourteen agents reading a fourth copy of doctrine. They write corrections,
      which nothing here reads yet, and learning_events, which is dead.

  - id: routines
    reads: installed skills
    writes: nothing
    gap: Two live scheduled Routines with no path back into the ledger.

  - id: openclaw-vps
    reads: >
      agents.brief_content, pulled from Supabase every 15 minutes by
      render-identity.py into /root/.openclaw/skills/agent-*/SKILL.md. This is a
      real, working brain-to-filesystem pump and the only one in the fleet.
    writes: >
      system_health, five rows every 15 minutes, currently the only thing
      reporting DeepSeek balance as degraded. Also workflow_runs, and from
      2026-09-09 an hourly heartbeat carrying the n8n execution counter.
    role: >
      The watchdog that sits outside the systems it watches. n8n-exec-governor.py
      runs here rather than in n8n precisely so it cannot be starved by the thing
      it measures, and that separation is the one structural property the rest of
      the estate cannot give itself.
    gap: >
      Until 2026-09-09 it had no heartbeat and appeared in no manifest, so nothing
      could tell a healthy host from a dead one. An external check that nobody
      audits is a single point of failure wearing the costume of a safeguard.
