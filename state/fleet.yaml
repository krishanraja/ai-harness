    rules_files: [AGENTS.md, README.md]
    note: Admitted under the same 2026-10-22 ruling as heartside.

  - name: growth-heartside
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, PLAYBOOK.md]
    note: Heartside's growth engine. Admitted under the same 2026-10-22 ruling as heartside.

  - name: growth-makeyourmindup
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, PLAYBOOK.md]
    note: >-
      Make Your Mind Up's growth engine. Admitted 2026-10-29 with the other three engines so
      every engine receives the Engines section of contract/north-star-metric.md through the
