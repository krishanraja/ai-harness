    note: Mindmake's growth engine. Admitted 2026-10-29 on the same terms as growth-makeyourmindup.

  - name: growth-fulltime
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, PLAYBOOK.md]
    note: Full Time's growth engine. Admitted 2026-10-29 on the same terms as growth-makeyourmindup.

  - name: growth-legibility
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/BRIEF.md]
    note: Legibility's growth engine. Admitted 2026-10-29 on the same terms as growth-makeyourmindup.

  - name: claude-archive
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md]
    note: >-
      The vault of Claude transcripts and research (private). Admitted to the fleet by Krish's
      ruling in this change's commit; out of the repository administration publisher (excluded
      in contract/repository-administration.json) until Krish accepts it there by name.

  - name: content-watcher
    # Renamed from video-compression on 2026-10-24; the former name redirects here.
    aliases: [video-compression]
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/BRIEF.md]
    note: Content Watcher and the Video Compression Engine. Admitted on the same terms as claude-archive.

  - name: filearchives
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, RESUME.md]
    note: The Drive folder record and consent guard. Admitted on the same terms as claude-archive.

  - name: inspirationhouse
    canon_target: AGENTS.md
