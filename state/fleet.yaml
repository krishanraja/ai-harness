  - name: krish-clone
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/STRATEGY.md]
    note: Voice and likeness training library; its North Star is not set yet. Admitted on the same terms as claude-archive.

  - name: krish-raja
    canon_target: AGENTS.md
    entry: CLAUDE.md
    rules_files: [CLAUDE.md, AGENTS.md]
    note: krishraja.com. CLAUDE.md is its operating contract. Admitted on the same terms as claude-archive.

  - name: music-watcher
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md]
    note: >-
      trackcard and Krish's Music Brain; runs on the worker server with the Music Inspo watcher.
      Its North Star is not set yet. Admitted on the same terms as claude-archive (Krish, 2026-11-14).

  - name: sendlinks
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md, docs/STATE.md]
    default_branch: main
    note: >-
      Tracked file links (Supabase edge functions). One branch, main, its default since Krish
      switched it on 2026-11-14. Admitted on the same terms as claude-archive.

  - name: internal-auditor
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md]
    note: >-
      The standing auditor: scans every fleet repository each week and holds it to its North
      Star, current docs, no stale pull requests or branches, and additions that compound
      rather than sprawl. A Control Center specialist engine. It may close pull requests and
      delete branches idle 7 days or more, recording each head sha in its restore ledger first
      (Ruling, Krish, 2026-11-23; docs/proposals/2026-11-23-auditor-and-strategist.md). Out of
      the repository administration publisher until Krish accepts it there by name.

  - name: strategist
    canon_target: AGENTS.md
    entry: AGENTS.md
    rules_files: [AGENTS.md]
    note: >-
      The portfolio strategist: brings the recovery plays the U5 rule in
      contract/north-star-metric.md asks for and convenes the council as Krish's weekly board,
      and at once on any U5 (Ruling, Krish, 2026-11-23). A Control Center specialist engine; its
      output lands on Control Center's one list, never on a surface of its own. Admitted on the
      same terms as internal-auditor.

adapters:
  - id: claude
    template: contract/templates/adapter-claude.md
    output: adapters/claude/CLAUDE.md
    surface: windows-primary
  - id: codex
    template: contract/templates/adapter-codex.md
    output: adapters/codex/AGENTS.md
    surface: windows-primary
  - id: cursor
    template: contract/templates/adapter-cursor.mdc
    output: adapters/cursor/krish-core.mdc
    surface: windows-primary

machines:
  - id: windows-primary
    clients: [claude-code-user, cursor-primary, codex-current, claude-desktop]
    reports: pull-and-report
  - id: windows-codex
    clients: [codex-surface-07a67cda9f99]
    reports: pull-and-report
    note: >-
      Latest skill heartbeat is healthy on v2026.09.08.2. Hosted observation
      emission is still pending because a mounted drive does not provide safe
      access to that machine's user credential store or prove its client is running.
  - id: cloud-linux
    clients: [github-actions, claude-code-web]
    reports: rendered-per-run
    note: Ephemeral. Renders from the commit it checks out, so it is never behind by construction.
  - id: openclaw-vps
    clients: [openclaw-gateway]
    reports: heartbeat-and-health
    note: >
      Declared 2026-09-09 after a read-only audit disproved the assumption that it
      was idle. 31 root cron entries, 33 gateway jobs, 196 days uptime. It already
      reads the brain and writes to it every 15 minutes and was in no manifest,
      which is why five render logs could die at the 2026-08-29 rebrand and go
      unnoticed for eleven days. Evidence: state/vps-liveness-audit-2026-09-09.md.
      MOVED 2026-11-14 20:08 UTC: the whole OpenClaw fleet (gateway, 15 jobs, 27
      cron lines, family bots, clock, Heartside) now runs on the worker server
      (Hetzner CPX32, Helsinki); the old box was DELETED the same night on
      Krish's ruling (a Hetzner snapshot is the rollback). 12 items retired by
      name. Report, checked at T0/T+24h/T+7d: state/vps/MIGRATION-2026-11-14.md.

# What each surface takes from the brain, and what it gives back.
#
# The question was whether every place Krish works contributes to the central
# memory as well as reading from it. Listed honestly, most do not. A surface
# that only reads is a place where a ruling made in conversation is lost the
# moment the session ends, and audit-harness.mjs opens a standing
# surface-contract finding for every one of them until it has a write path.
surface_contracts:
  - id: claude-code-lorimer
    reads: canon block, rendered adapter, 29 installed skills
    writes: Ruling (Krish, DATE) lines in commit bodies, canary reports, hosted redacted observations, and the private session miner the nightly sync runs weekly (scripts/Invoke-SessionMiner.ps1) once a submission route is chosen
    event_surface: claude-code
    gap: Claude Code account OAuth was expired during the fresh-agent canary; the MCP config itself connected and its isolated identity canary passed.

  - id: cursor-lorimer
    reads: krish-core.mdc, 29 installed skills
    writes: rulings in commit bodies, hosted redacted observations
    event_surface: cursor
    gap: Cursor MCP discovery reached the one hosted tool, but the headless agent account was not logged in for an end-to-end model invocation.

  - id: codex-lorimer
    reads: AGENTS.md, 29 installed skills
    writes: rulings in commit bodies, canary reports, hosted redacted observations, and once installed the private weekly session miner
    event_surface: codex

  - id: codex-surface
    reads: AGENTS.md, 29 installed skills
    writes: rulings in commit bodies, canary reports
    gap: Hosted observation emitter not provisioned. The mapped drive is discovery evidence only and the architecture does not depend on it.

  - id: claude-code-cloud
    reads: canon block, and skills live through the Control Center connector's get_skill
    writes: pull requests, Ruling lines in commit bodies, and hosted redacted observations through the Control Center connector
    event_surface: claude-code-web
    gap: Live capture is the only route, because the weekly cloud session miner is retired (Ruling, Krish, 2026-11-13; docs/harness/cloud-session-miner.md), so a correction a session did not send live reaches the brain only through a merged commit with a Ruling line.

  - id: claude-ai-chat
    reads: the account instructions' fixed pointer, which loads the routing and skills live through the Control Center connector's get_skill
    writes: hosted redacted observations through the Control Center connector (control-center ADR-037)
    event_surface: claude-ai

  - id: chatgpt-chat
    reads: nothing from the harness yet
    writes: hosted redacted observations through the same connector, best effort
    event_surface: chatgpt
    capture: best-effort
    gap: >
      Its custom connectors ask for confirmation on every write, so capture there
      cannot be silent; codex work is mined separately.

  - id: perplexity-computer
    reads: cloud skill catalogue
    writes: nothing
    capture: out-of-scope
    note: Krish uses it for deep research only, so it is out of capture scope (Ruling, Krish, 2026-10-14).

  - id: n8n-agents
    reads: agents.brief_content, which is not rendered from the canon
    writes: nothing
    gap: >
      Fourteen agents reading a fourth copy of doctrine. They write corrections,
      which nothing here reads yet, and learning_events, which is dead.

  - id: routines
    reads: installed skills
    writes: nothing
    gap: Claude Code scheduled tasks with no path back into the ledger. Read from one account on 2026-11-12, four were live there (three hunter writers and the weekly session miner); the session miner was switched off there on 2026-11-13 by Krish's ruling that no Claude scheduled task reads sessions, and the other account was not read.

  - id: openclaw-vps
    reads: >
      agents.brief_content, pulled from Supabase every 15 minutes by
      render-identity.py into /root/.openclaw/skills/agent-*/SKILL.md. This is a
      real, working brain-to-filesystem pump and the only one in the fleet.
    writes: >
      system_health, five rows every 15 minutes, currently the only thing
      reporting DeepSeek balance as degraded. Also workflow_runs. The hourly
      heartbeat carrying the n8n execution counter ran from 2026-09-09 until it
      was retired on 2026-11-14 (B21). Since 2026-11-14 all of this runs on the
      worker server (state/vps/MIGRATION-2026-11-14.md).
    role: >
      The watchdog that sits outside the systems it watches. n8n-exec-governor.py
      runs here rather than in n8n precisely so it cannot be starved by the thing
      it measures, and that separation is the one structural property the rest of
      the estate cannot give itself.
    gap: >
      Until 2026-09-09 it had no heartbeat and appeared in no manifest, so nothing
      could tell a healthy host from a dead one. An external check that nobody
      audits is a single point of failure wearing the costume of a safeguard.

# ------------------------------------------------------------------ registry
#
# Every repository krishanraja owns, placed on the architecture map (Krish,
# 2026-11-24: "ikigai is the layer above the north stars ... drawing out a map
# of exactly what this architecture looks like"; "every single repo must be able
# to understand what other repos (capabilities) exist around it so
# collaboration is proactive at all times"). One home: everything that needs a
# repository's scope, layer, role, venture or capability reads it here.
# `repos` above stays the list of canon surfaces; every surface must appear
# here, and scripts/render-capabilities.mjs renders the in-scope rows into
# skills/krish-principles/references/capabilities.md, the table every
# repository reads before building or deciding.
#
#   scope    in        part of the OS: scored, triaged, fixed, and on the table
#            personal  Krish's own project, outside the OS: not scored
#            unplaced  no caller found yet; Krish decides in or personal
#            dormant   kept, not worked (Krish, 2026-11-24: fractionl-circle)
#            excluded  outside the map by Krish's word (2026-11-24)
#   layer    doctrine | hub | keeper | specialist | service | producer | product
#   confirm  true where Krish has still to confirm the scope
#   rename   an approved new name, applied by its own pull request (Krish, 2026-11-24)
registry:
  - name: ai-harness
    scope: in
    layer: doctrine
    role: The canon. The Ikigai and who Krish is, the contracts, the 33 skills, the council, the brain, this registry.
    capability: Rules, skills and the council for every repository; renders the canon block and the neighbours table.
    call: A pull request here, merged through the judge panel; read any skill with Control Center get_skill.
    when: A rule, skill or contract should change, a correction keeps repeating, or a decision needs the council.
  - name: control-center
    scope: in
    layer: hub
    venture: mindmake
    role: Krish's one surface and the clock. The one list, the engine protocol, the North Star readers, the model routes.
    capability: Gets a decision in front of Krish, reads any venture's state and number, and runs the humour, divergent and research routes.
    call: The engine protocol on your engine's bearer, or the Control Center connector tools (get_venture_state, get_skill, divergent_*, report_to_taste_engine, record_harness_observation).
    when: Anything needs Krish's yes, a live number, another venture's state, or a paid model route under a cap.
  - name: internal-auditor
    scope: in
    layer: keeper
    role: Keeper of the architecture map. Scores every repository, merges green pull requests, fixes, sweeps, and curates OS > Systems.
    capability: Fixes code through its fix queue, merges your green pull requests, and routes work to the specialist that should do it.
    call: Open an issue labelled auditor-fix in your own repository; the fix queue takes it. Read docs/scorecards for where you stand.
    when: Something is broken that this session cannot fix, a red check is not yours, or your repository drifts from the map.
  - name: strategist
    scope: in
    layer: specialist
    venture: mindmake
    role: The one strategy brain, anchored on the Ikigai. Weekly board through the council, three recovery plays for any U5.
    capability: Turns a stalled number or an idea into plays and one-week tests, tested against the Ikigai's decision rules.
    call: It reads every North Star weekly and any U5 within 24 hours; put a decision for the board to Control Center as an engine proposal behind the strategy wall.
    when: A number is at U4 or U5, growth and product disagree, or an idea needs a test rather than a plan.
  - name: divergence-engine
    scope: in
    layer: specialist
    role: Ideas outside the consensus, and a free score of how familiar any output is.
    capability: Scores a draft or a plan for sameness for free, and maps or challenges an angle (paid, capped).
    call: Control Center /api/divergent/<caller>, or the connector tools divergent_score and divergent_record (free) and divergent_run (paid, capped), in your own namespace.
    when: Ideas keep coming back the same, a number sits at U4 or U5 with nothing proposed, or an angle is about to be committed.
    rename: The package and the canon call it divergent-thinker; both become divergence-engine.
  - name: humour-engine
    scope: in
    layer: specialist
    role: The fleet's one definition of humour, its prompts, ontology and validators.
    capability: Makes copy funny the way Krish means it, and checks a joke against the definition.
    call: Control Center /api/humour/<caller> or the engine route /api/growth/engines/<slug>/humour, or the pinned package.
    when: Public copy should land with humour, or a line needs a humour check before it goes out.
  - name: AEO-Engine
    scope: in
    layer: specialist
    role: The one AI-answers specialist for every venture.
    capability: Tells a venture whether AI assistants cite it first for its buyers' questions, and which pages to win.
    call: POST /api/growth/engines/<slug>/answers with your product's buyer questions; read your standing in your directive's ai_answers.
    when: You need to know how AI assistants answer your buyers, or which cited pages are worth winning.
    rename: answers-engine
  - name: filearchives
    scope: in
    layer: specialist
    role: Krish's folder record and consent guard, and custodian of the files that matter most.
    capability: Follows every Drive and dev folder by id, and protects the Ikigai and its doctrine from being moved, renamed or changed without his ruling.
    call: Report a folder change with its tools/report_folder_change.ps1; its protected files are in policy/protected-files.json.
    when: You create, move, rename or remove a folder in Krish's Drive or dev folders, or touch a protected file.
  - name: software-qa
    scope: in
    layer: specialist
    confirm: true
    role: Code and UI quality checks (to be confirmed against its own README).
    capability: A QA pass on code and UI that a fix needs before it merges.
    call: An issue in its repository, or the auditor's routing, once its own route is read and recorded here.
    when: A fix touches code or UI that needs a QA pass beyond the repository's own checks.
  - name: sendlinks
    scope: in
    layer: service
    role: Tracked file links.
    capability: Sends one of Krish's files as a link that says when it was opened.
    call: The Control Center connector make_send_link and read_send_link.
    when: A file goes to someone and you need to know they opened it.
  - name: content-watcher
    scope: in
    layer: service
    aliases: [video-compression]
    role: Turns pasted links and screenshots into readings in Krish's inspiration folders.
    capability: Reads a pasted post or screenshot and files the reading.
    call: Control Center's inspiration queue, or content-engine api/watch.
    when: A link or screenshot should become a reading Krish can use.
  - name: inspirationhouse
    scope: in
    layer: service
    role: The taste ledger.
    capability: Holds Krish's approved taste rules, by venture, and records each preference he states.
    call: get_approved_taste and report_to_taste_engine through the Control Center connector.
    when: Before writing or designing for Krish, and whenever he states a preference.
    rename: taste-engine
  - name: krish-clone
    scope: in
    layer: service
    role: Krish's voice and likeness library.
    capability: Supplies approved voice and likeness material for content.
    call: content-engine's takes intake (board/_takesIn.ts).
    when: A piece needs Krish's approved voice or likeness.
  - name: content-engine
    scope: in
    layer: producer
    venture: publication
    role: Make Your Mind Up's hero assets, the video engine, the research library.
    capability: Makes finished articles, cuts, thumbnails and covers, and finds or files research.
    call: Control Center's ideas gate; find_research and add_piece_material for the research library.
    when: A Make Your Mind Up piece is made, or research should be found before paying for it.
  - name: growth-makeyourmindup
    scope: in
    layer: producer
    venture: publication
    role: Make Your Mind Up growth.
    capability: Posting, carousels, memes, Notes and subscriber growth for Make Your Mind Up.
    call: Control Center dispatch on its own bearer; Krish instructs it with his Instruct press.
    when: Make Your Mind Up needs reach or subscribers.
  - name: growth-mindmake
    scope: in
    layer: producer
    venture: mindmake
    role: Mindmake growth.
    capability: Outreach rows, pitches, visibility, guests and events for Mindmake.
    call: Control Center dispatch on its own bearer.
    when: Mindmake needs meetings, visibility or a pitch.
  - name: growth-heartside
    scope: in
    layer: producer
    venture: heartside
    role: Heartside growth.
    capability: Organic sales growth for Heartside.
    call: Control Center dispatch on its own bearer.
    when: Heartside needs organic sales.
  - name: growth-fulltime
    scope: in
    layer: producer
    venture: full_time
    role: Full Time growth.
    capability: Growth for Full Time.
    call: Control Center dispatch on its own bearer.
    when: Full Time needs growth.
    rename: growth-full-time
  - name: growth-legibility
    scope: in
    layer: producer
    venture: legibility
    role: Legibility growth.
    capability: Weekly builders and outreach for Legibility.
    call: Control Center dispatch on its own bearer.
    when: Legibility needs builders.
  - name: mindmake
    scope: in
    layer: product
    venture: mindmake
    role: mind/make, the company site.
    capability: The company's public site.
    call: Its own repository's issues; the fix queue takes auditor-fix.
    when: The company site changes.
  - name: ctrl-mindmake
    scope: in
    layer: product
    venture: mm_ctrl
    role: CTRL by Mindmake, the live product repository.
    capability: CTRL, the product.
    call: Its own repository's issues; the fix queue takes auditor-fix.
    when: CTRL changes.
    rename: ctrl
  - name: heartside
    scope: in
    layer: product
    venture: heartside
    role: Heartside, the shop.
    capability: The Heartside shop.
    call: Its own repository's issues; the fix queue takes auditor-fix.
    when: The shop changes.
  - name: full-time
    scope: in
    layer: product
    venture: full_time
    role: Full Time.
    capability: The Full Time product.
    call: Its own repository's issues; the fix queue takes auditor-fix.
    when: Full Time changes.
  - name: legibility
    scope: in
    layer: product
    venture: legibility
    role: Legibility.
    capability: The Legibility product.
