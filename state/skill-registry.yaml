quarantine:
  - name: mobile-app-ui-design
    reason: Broad generic auto-trigger collides with krish-design and build-apps-with-krish; hard-coded aesthetic, breakpoint, component, and accessibility prescriptions are not current-source or Krish-specific. Found enabled in Claude Cloud and present only on the Cursor local surface on 2026-08-07.
    replacement: krish-design mobile-web reliability floor plus optional manual-only design-intelligence-search retrieval.
    next_gate: Replacement is installed. Claude Cloud copy is removed and the local copy is outside every active route; dated local backups remain recoverable.
  - name: legacy-tools-access
    reason: Credential values embedded in multiple local and cloud copies.
    replacement: tools-access
    next_gate: Rotate affected credentials in consumer-safe batches, scrub copies/history, then replace surfaces.
  - name: n8n
    reason: Oversized monolith with embedded credentials and dynamic fleet facts.
    replacement: mindmake-os for live routing plus n8n-operator for provider mechanics.
    next_gate: Candidate operator must pass held-out evaluation and canary before legacy copies are retired.
  - name: fleet-ops-and-krish-fleet-ops
    reason: Conflicting stale fleet counts and deployment facts.
    replacement: mindmake-os live-state routing plus its fleet-reconciliation reference; n8n-operator for workflow mechanics.
    next_gate: Candidate release and canary, then retire exact legacy copies after approval.
  - name: n8n-cli
    reason: Unprovenanced command catalogue with destructive operations, local credential storage guidance, and no authority or downstream verification contract.
    replacement: n8n-operator.
    next_gate: Preserve only mechanics independently confirmed against official n8n sources; do not activate beside the operator.
  - name: legacy-ux-testing-agent
    reason: Missing frontmatter, over 500 lines, embedded credentials, hardcoded app registry, and overbroad auto-fix authority.
    replacement: ux-testing-agent
    next_gate: Replace local and cloud copies after user approval.

