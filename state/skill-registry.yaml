  artifact_hash_algorithm: sha256-path-nul-file-sha256-ordinal-v1
  approved_at: 2026-09-08
  approved_by: Krish Raja
  approval_basis: >-
    Standing instruction of 2026-09-08 to complete the outstanding work, applied
    to a change he had already ruled on. Recorded as the basis rather than left
    implied, because an approval line that cannot say what it rests on is not a
    record.
  approval_note: >-
    One skill changes and it restores a behaviour the 2026-09-08 ruling always
    intended. video-engine set allow_implicit_invocation: false, which does not
    narrow which message starts the engine, it stops any message starting it,
    and on Codex it also removes the skill from the discoverable catalog. SURFACE
    proved it: the exact phrase started nothing, twice, while both negative
    canaries passed for the wrong reason. Narrowness stays in the description,
    which names the exact match and every excluded form. Everything else in this
    release is tooling, documentation and recorded evidence.
  supersedes_reason: >-
    v2026.09.08.1 is byte-verified on four surfaces and carries a launcher that
    cannot launch on Codex. It stays the rollback target and must not be the
    install target.


