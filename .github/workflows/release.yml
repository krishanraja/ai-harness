name: Publish immutable harness release

on:
  push:
    tags:
      - harness-v*
  # A tag push is the normal path. This second one exists because a cloud
  # session's credential is scoped to branch pushes and GitHub returns 403 on
  # refs/tags, so a release approved in the cloud could be built by nobody and
  # sat unpublished while every surface correctly read as behind. The workflow
  # has contents: write, so it can create the tag it is about to build from.
  #
  # Everything below is unchanged and still applies: the tag name is validated
  # to the same pattern, the release is built TWICE and the two manifests must
  # agree skill for skill, the installer self-test runs, and an existing release
  # is never overwritten. The only difference is who creates the ref.
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id without the harness- prefix, e.g. v2026.09.08.2"
        required: true
        type: string
      ref:
        description: "Commit or branch to tag. Defaults to the default branch."
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  validate-build-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' }}

      # Only on the dispatch path, and only after the name is validated. The tag
      # is created BEFORE the build so that --verify-tag below still means what
      # it means: the release is published against a real ref, not a name.
      - name: Create the tag when dispatched
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $id = $env:RELEASE_INPUT
          if ($id -notmatch '^v\d{4}\.\d{2}\.\d{2}\.\d+$') {
            throw "Invalid release id: $id. Expected the form v2026.09.08.2, with no harness- prefix."
          }
          $tag = "harness-$id"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) { throw "$tag already exists on origin. Releases are immutable and are never re-cut." }
          git tag -a $tag -m "Harness release $id, cut by workflow_dispatch from $(git rev-parse HEAD)."
          git push origin "refs/tags/$tag"
          "RELEASE_TAG=$tag" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Validate tag and build twice
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git diff --check

          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^harness-v\d{4}\.\d{2}\.\d{2}\.\d+$') {
            throw "Invalid release tag: $tag"
          }

          $releaseId = $tag.Substring('harness-'.Length)
          $outA = Join-Path $env:RUNNER_TEMP 'release-a'
          $outB = Join-Path $env:RUNNER_TEMP 'release-b'
          & .\scripts\Build-HarnessRelease.ps1 -Root $env:GITHUB_WORKSPACE -OutputDirectory $outA -ReleaseId $releaseId
          if ($LASTEXITCODE -ne 0) { throw 'First release build failed.' }
          & .\scripts\Build-HarnessRelease.ps1 -Root $env:GITHUB_WORKSPACE -OutputDirectory $outB -ReleaseId $releaseId
          if ($LASTEXITCODE -ne 0) { throw 'Second release build failed.' }

          $manifestA = Get-Content -LiteralPath (Join-Path $outA "release-$releaseId.json") -Raw | ConvertFrom-Json
          $manifestB = Get-Content -LiteralPath (Join-Path $outB "release-$releaseId.json") -Raw | ConvertFrom-Json
          $differences = @()
          foreach ($skill in $manifestA.skills) {
            $other = $manifestB.skills | Where-Object name -eq $skill.name
            if (-not $other -or
                $skill.source_skill_sha256 -ne $other.source_skill_sha256 -or
                $skill.artifact_sha256 -ne $other.artifact_sha256 -or
                $skill.perplexity_artifact_sha256 -ne $other.perplexity_artifact_sha256) {
              $differences += $skill.name
            }
          }
          if ($manifestA.skills.Count -ne $manifestB.skills.Count -or $differences.Count -ne 0) {
            throw "Repeat-build mismatch: $($differences -join ', ')"
          }

          & .\scripts\Test-HarnessReleaseInstaller.ps1 -ManifestPath (Join-Path $outA "release-$releaseId.json")
          if ($LASTEXITCODE -ne 0) { throw 'Release installer self-test failed.' }

          $checksumPath = Join-Path $outA 'SHA256SUMS.txt'
          Get-ChildItem -LiteralPath $outA -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object { "$(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content -LiteralPath $checksumPath -Encoding utf8

          "RELEASE_ID=$releaseId" | Add-Content -LiteralPath $env:GITHUB_ENV
          "RELEASE_DIRECTORY=$outA" | Add-Content -LiteralPath $env:GITHUB_ENV
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; immutable releases are never overwritten." }

          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_DIRECTORY -File | Sort-Object Name | ForEach-Object FullName)
          gh release create $tag @assets --verify-tag --title $tag --notes "Validated deterministic harness release from commit $env:GITHUB_SHA. Publishing does not deploy or enable any client surface."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }

  # Registration used to be a hand commit ("release: register vX"), and the PC
  # installer refuses any release the registry does not name as approved, so an
  # unregistered release blocked every PC run. Krish ruled on 2026-10-15 that
  # every release built from main after he merges a change counts as approved
  # by him; this records that with the manifest hash, the skills-tree aggregate
  # recomputed from git objects, the changed skills, and every surface marked as
  # awaiting the release (scripts/register-release.mjs).
  register:
    needs: validate-build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, Node 24
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Register the release and render CURRENT.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-build-publish.outputs.tag }}
        run: |
          set -euo pipefail
          id="${TAG#harness-}"
          [[ "$id" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::Invalid tag $TAG"; exit 1; }
          work="$RUNNER_TEMP/register"
          mkdir -p "$work"
          gh release download "$TAG" --pattern "release-$id.json" --dir "$work"
          published_at=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            prev=$(awk '/^latest_approved_release:/{f=1;next} f&&/^[^ ]/{exit} f&&/^  release_id:/{print $2; exit}' state/skill-registry.yaml)
            if [ "$prev" = "$id" ]; then echo "$id is already registered."; exit 0; fi
            args=(--manifest "$work/release-$id.json" --published-at "$published_at")
            if [ ! -f "$work/release-$prev.json" ]; then gh release download "harness-$prev" --pattern "release-$prev.json" --dir "$work" || true; fi
            if [ -f "$work/release-$prev.json" ]; then args+=(--previous-manifest "$work/release-$prev.json"); fi
            node scripts/register-release.mjs "${args[@]}"
            node scripts/render-current-state.mjs
            node scripts/validate-release-coherence.mjs > /dev/null
            git add state/skill-registry.yaml CURRENT.md
            git commit --quiet -m "release: register $id" -m "Registered by scripts/register-release.mjs under the standing ruling of 2026-10-15: every release built from main after Krish merges a change counts as approved by him."
            if git push --quiet origin HEAD:main; then echo "Registered $id."; exit 0; fi
            sleep $((attempt * 7))
          done
          echo "::error::$id was published but could not be registered after four attempts. Re-run this job."
          exit 1
