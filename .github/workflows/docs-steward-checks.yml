name: Docs steward invariants
on:
  pull_request:
    paths: [".github/workflows/docs-steward.yml", ".github/workflows/docs-steward-checks.yml", "scripts/test-docs-steward-workflow.mjs", "scripts/steward/**", "scripts/closeout/**"]
  push:
    branches: [main]
    paths: [".github/workflows/docs-steward.yml", ".github/workflows/docs-steward-checks.yml", "scripts/test-docs-steward-workflow.mjs", "scripts/steward/**", "scripts/closeout/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node scripts/test-docs-steward-workflow.mjs
      - run: node scripts/steward/test-validate-closeout.mjs
      - run: node scripts/closeout/test-check.mjs
