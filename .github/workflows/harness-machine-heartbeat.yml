name: Harness machine heartbeat

on:
  repository_dispatch:
    types: [harness-machine-heartbeat]

permissions:
  contents: write

concurrency:
  group: harness-machine-heartbeat
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and record the heartbeat
        env:
          CLOCK: ${{ github.event.client_payload.clock }}
          STATUS: ${{ github.event.client_payload.status }}
          RELEASE: ${{ github.event.client_payload.release }}
          N8N_CYCLE_START: ${{ github.event.client_payload.n8n_cycle_start }}
          N8N_EXECUTIONS: ${{ github.event.client_payload.n8n_executions_this_cycle }}
          GATEWAY_JOBS: ${{ github.event.client_payload.gateway_jobs_defined }}
        run: >
          node scripts/record-machine-heartbeat.mjs
          --clock "$CLOCK" --status "$STATUS" --release "$RELEASE"
          --n8n-cycle-start "$N8N_CYCLE_START"
          --n8n-executions "$N8N_EXECUTIONS"
          --gateway-jobs "$GATEWAY_JOBS"

      - name: Commit the clock
        # CLOCK comes through the environment rather than being interpolated
        # into the script. The previous line put the raw client_payload straight
        # into a git commit -m, which is a shell injection shape. It was not
        # exploitable, because the validate step above allowlists the clock name
        # and a failing step stops the job before this one runs, but that safety
        # was an accident of step ordering rather than a property of this step.
        # A later edit adding continue-on-error, or reordering, would have made
        # it live with nothing to catch it.
        env:
          CLOCK: ${{ github.event.client_payload.clock }}
        run: |
          set -euo pipefail
          git config user.name "Harness machine clock"
          git config user.email "noreply@github.com"
          git add state/heartbeats.json
          if git diff --cached --quiet; then
            echo "The clock did not change."
            exit 0
          fi
          git commit -m "chore(heartbeat): record ${CLOCK}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Heartbeat could not be published after three attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
