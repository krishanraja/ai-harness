name: Harness machine heartbeat

on:
  repository_dispatch:
    types: [harness-machine-heartbeat]

permissions:
  contents: write

concurrency:
  group: harness-machine-heartbeat
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and record the heartbeat
        env:
          CLOCK: ${{ github.event.client_payload.clock }}
          STATUS: ${{ github.event.client_payload.status }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: node scripts/record-machine-heartbeat.mjs --clock "$CLOCK" --status "$STATUS" --release "$RELEASE"

      - name: Commit the clock
        run: |
          set -euo pipefail
          git config user.name "Harness machine clock"
          git config user.email "noreply@github.com"
          git add state/heartbeats.json
          if git diff --cached --quiet; then
            echo "The clock did not change."
            exit 0
          fi
          git commit -m "chore(heartbeat): record ${{ github.event.client_payload.clock }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Heartbeat could not be published after three attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
