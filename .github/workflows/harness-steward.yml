# Harness steward: keeps the canon renderable, portable and self-consistent.
#
# Why this exists: the canon was well governed and had never reached a product
# repository. There was no renderer, the three client adapters were hand-kept
# near-duplicates, and twenty-six files carried one machine's absolute paths,
# so the contract was only correct on one laptop. This job proves, on every
# push and once a night, that the canon still renders byte-identically, that
# every surface is accounted for, and that no machine-specific path has crept
# back in.
#
# Three jobs, in order of how much they are allowed to do:
#
#   surfaces    never writes. The gate. Runs on every push and pull request.
#   audit       never writes. The canon audits itself against its own quality
#               standard nightly and reports findings. A finding is a decision
#               for a person, never a silent edit: "review-date expiry opens a
#               finding; it does not silently rewrite a skill."
#   reconcile   writes, and only ever through a pull request on a named branch.
#               Nightly. An edit made inside the markers in a repository is
#               NEVER overwritten; it becomes a proposal against the canon.
#
# Runs on ubuntu with no dependencies. Nothing here needs a machine to be awake
# or a browser to be open, which is the whole point.

name: Harness steward

# A new push supersedes the run before it. Without this, a hung job on an older
# commit keeps burning a runner while the commit that fixes it queues behind it.
concurrency:
  group: harness-steward-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 06:40 Brisbane. Late enough that the docs steward's nightly pass over the
    # fleet has already landed, so parity is checked against today's state.
    - cron: "40 20 * * *"
    # 07:40 Brisbane on Sunday. The weekly proposal, an hour after that night's
    # observation so it reads a ledger that includes the day just finished.
    - cron: "40 21 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify every surface and report, open nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-steward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docs steward's fleet manifest, so the two stewards cannot name
      # different repositories without a failing check. Sparse and shallow:
      # one file, no history.
      - name: Fetch the docs steward fleet manifest
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/krishanraja/control-center.git .steward-src
          git -C .steward-src sparse-checkout set docs/steward
          mkdir -p .steward
          cp .steward-src/docs/steward/fleet.json .steward/fleet.json
          rm -rf .steward-src
          echo "fleet manifest: $(wc -c < .steward/fleet.json) bytes"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render is byte-stable
        run: node scripts/render.mjs --check

      - name: Surfaces valid
        run: node scripts/validate-surfaces.mjs --fleet-json .steward/fleet.json

      # The Node reimplementation of the release hash must keep agreeing with
      # the PowerShell that runs on the machines. It stopped agreeing once,
      # silently, and the disagreement read as drift on two hosts rather than as
      # a bug here. Deterministic, free, no network.
      - name: The aggregate still matches the Windows construction
        run: node scripts/check-aggregate.mjs

      # The provenance checker is the gate that stops a rule changing without a
      # record of who changed it. A gate that cannot fail reads as health, so
      # its own mutation suite runs first, before it is trusted on the canon.
      - name: The provenance checker can still fail
        run: node scripts/test-brain-rules.mjs

      - name: Render twice and prove the second run changes nothing
        run: |
          set -euo pipefail
          node scripts/render.mjs > /dev/null
          node scripts/render.mjs > /dev/null
          git diff --exit-code -- adapters/ || {
            echo "::error::Rendering is not deterministic. Two runs from one commit produced different bytes."
            exit 1
          }
          echo "Two renders from one commit, byte-identical."

  # The canon is not exempt from the treatment it gives everyone else.
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the harness against its own quality standard
        run: node scripts/audit-harness.mjs --out audit.md
      - name: Put the findings in the run summary
        if: always()
        run: cat audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-audit
          path: audit.md
          retention-days: 30

  # The only job here that writes anything, and only ever as a pull request.
  reconcile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail loud rather than quietly doing nothing. A night the reconciler did
      # not run must never look like a night with no drift.
      - name: The fleet credential must exist
        env:
          HAS_TOKEN: ${{ secrets.FLEET_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FLEET_TOKEN is not set. The reconciler reads and writes ten repositories from this one job. Add a fine-grained PAT with contents and pull-requests write on the fleet as the repository secret FLEET_TOKEN."
            exit 1
          fi

      - name: Reconcile every surface
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/reconcile.mjs --dry-run --out reconcile.md
          else
            node scripts/reconcile.mjs --out reconcile.md
          fi

      - name: Put the reconciliation in the run summary
        if: always()
        run: cat reconcile.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canon-reconciliation
          path: reconcile.md
          retention-days: 30

  # The learning half. Reads what happened; never decides what it means.
  observe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The fleet credential must exist
        env:
          HAS_TOKEN: ${{ secrets.FLEET_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FLEET_TOKEN is not set. An observer that records nothing looks exactly like a quiet night, so this fails rather than passing."
            exit 1
          fi

      # The audit and the reconciler write findings the observer folds into the
      # same ledger, so the weekly proposer reads one stream and not four.
      - name: Collect this run's findings
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/audit-harness.mjs --out audit.md > /dev/null
          node scripts/reconcile.mjs --dry-run --out reconcile.md > /dev/null

      - name: Observe
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: node scripts/observe.mjs

      # Committed, so the ledger is diffable and cannot be quietly rewritten.
      # Append-only by construction: every line carries a stable id and the
      # script never rewrites an existing one.
      - name: Commit the ledger
        run: |
          set -euo pipefail
          rm -f audit.md reconcile.md
          if git diff --quiet -- state/; then
            echo "Nothing new observed. Committing nothing is the correct outcome."
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add state/observations state/heartbeats.json
          git commit \
            -m "chore(observe): $(date -u +%Y-%m-%d) ledger" \
            -m "Appended by scripts/observe.mjs. Evidence only; nothing here is a decision."
          git push origin HEAD:main

  # Sundays: what the evidence has earned, and nothing more.
  propose:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '40 21 * * 0')
    needs: observe
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deterministic in. The brief says what crossed a threshold and quotes the
      # evidence; it never says what the answer is.
      - name: Build the brief
        run: node scripts/propose.mjs --out brief.md

      - name: Put the brief in the run summary
        run: cat brief.md >> "$GITHUB_STEP_SUMMARY"

      # A week with nothing earned opens nothing, which is what makes an open
      # proposal mean something when there is one.
      - name: Decide whether anything was earned
        id: earned
        run: |
          if grep -q '^## Nothing was earned this week' brief.md; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Nothing earned. Opening nothing."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # Model in the middle.
      - name: Write the proposals
        if: steps.earned.outputs.any == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the harness proposer for krishanraja/ai-harness.
            Read brief.md in the working directory. It is deterministic output: which clusters of observed evidence crossed a threshold, quoted with their sources. It does not tell you what to do, and nothing in this prompt overrides the repository's own contracts.
            Read contract/active-skill-quality-standard.md (especially Gate 10), contract/skill-routing-contract.md, and skills/ctrl-capture/SKILL.md before writing anything.
            For each block in the brief, decide the cheapest sufficient layer that should change, using the six classes the brief lists. "Nothing changes" is a valid and often correct answer, especially for blocks marked backfill; say so and say why rather than manufacturing a change.
            Write your proposals to docs/proposals/YYYY-MM-DD.md (today's date), one section per block, each in ctrl-capture's stage 9 shape: EVIDENCE, ALTERNATIVE EXPLANATIONS, IF WRONG, VALIDATION, PRIOR KNOWN-GOOD + ROLLBACK.
            Commit that file on a branch named harness/proposals-YYYY-MM-DD and push it. Do not open the pull request; the workflow does that deterministically after you.
            Never edit a skill, the registry, a contract, or an eval case in this run. You propose; a named human accepts. Never move a reviewed date. Never write an em dash. Never print a secret.
            Nobody is watching this session. Do not ask questions. If you cannot write a defensible proposal for a block, say that in the file and move on.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(git:*),Bash(node:*),Bash(cat:*),Bash(ls:*),Bash(date:*),Bash(gh:*),Read,Write,Edit,Glob,Grep"

      # Deterministic out. Opening the pull request is mechanical, so it must not
      # depend on the model remembering to do it: the first live run wrote the
      # proposals and pushed the branch, then stopped, and the proposals sat
      # invisible on a branch nobody was looking at.
      - name: Open the pull request
        if: steps.earned.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="harness/proposals-$(date -u +%Y-%m-%d)"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "::warning::${BRANCH} was never pushed, so there is nothing to open a pull request for."
            exit 0
          fi
          if gh pr view "$BRANCH" --json number > /dev/null 2>&1; then
            echo "A pull request for ${BRANCH} is already open."
            exit 0
          fi
          # A heredoc whose terminator sits inside an indented YAML block scalar
          # never terminates, which is why this step failed on its first real
          # run. printf to a file instead: no quoting rules to get wrong.
          printf '%s\n' \
            "This week's proposals from the harness observer, written against the deterministic brief attached to the run." \
            "" \
            "A document, not a change. No skill, registry entry, contract or eval case is touched by this branch. Accept or reject each block." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_" > /tmp/pr-body.md
          gh pr create \
            --base main --head "$BRANCH" \
            --title "Capture proposals, $(date -u +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-brief
          path: brief.md
          retention-days: 90

  # The one job that asks whether a change made the canon better.
  #
  # Every other job here checks that the canon is well formed. Two benches of
  # criteria, one from the memory-systems doctrine and one from Krish's own
  # standards, compare the canon before this change against the canon after it
  # and must name the rule id that improved or regressed. They never score:
  # absolute scoring was tried and two controls over identical cases moved
  # recall by 0.250 and then 0.125 between models, the stronger model scoring
  # lower each time.
  #
  # It runs only on a pull request that actually touches the canon, and only
  # when a key exists. A missing key skips the job with a note rather than
  # failing it, because a panel that has never been armed should say so plainly
  # instead of turning every unrelated pull request red.
  judge:
    name: judge
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A hung model call must never hold a runner. The first run of this job sat
    # in "Run both benches" for eight minutes with nothing to show for it, which
    # is how an unbounded network call fails: silently, and for six hours.
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The protocol is testable without a model, and it is tested before it is
      # trusted. What it accepts, what it refuses, whether the mandatory dissent
      # actually bites, and whether a blocking regression really blocks.
      - name: The panel can still refuse a bad review
        run: node scripts/test-judge.mjs

      - name: Does this change touch the canon
        id: scope
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git diff --quiet "$BASE"...HEAD -- contract/ skills/ brain/; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No change to contract/, skills/ or brain/. The panel has nothing to compare." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run both benches
        id: run
        if: steps.scope.outputs.touched == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JUDGE_TIMEOUT_MS: "180000"
        run: |
          set -uo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "verdict=unarmed" >> "$GITHUB_OUTPUT"
            {
              echo "### Judge panel not armed"
              echo
              echo "The two benches, their sources and the whole protocol are in place and their"
              echo "regression suite passed above. The model call is the one part that cannot be"
              echo "faked, and it needs an \`ANTHROPIC_API_KEY\` repository secret that does not exist yet."
              echo
              echo "Until that secret is set this job reports the gap rather than pretending to a"
              echo "review it did not perform."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/judge.mjs --base "${{ steps.scope.outputs.base }}" --head HEAD --out judge.md
          rc=$?
          echo "verdict=$rc" >> "$GITHUB_OUTPUT"
          cat judge.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # A blocking regression requests changes. There is no auto-merge here to
      # stop, so the panel blocks the way any reviewer does. Krish overrules with
      # a commit body line "Ruling (Krish, DATE):", which the observer already
      # ledgers and which becomes that rule's new source.
      - name: Post the review
        if: steps.scope.outputs.touched == 'true' && github.event_name == 'pull_request' && steps.run.outputs.verdict != 'unarmed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f judge.md ] || exit 0
          if [ "${{ steps.run.outputs.verdict }}" = "1" ]; then
            gh pr review "${{ github.event.pull_request.number }}" --request-changes --body-file judge.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file judge.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-panel
          path: judge.md
          retention-days: 90
          if-no-files-found: ignore
